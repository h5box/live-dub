name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      - run: choco install ffmpeg --no-progress -y
      - run: ./scripts/build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME app/src-tauri/target/release/bundle/nsis/*.exe --title "LiveDub $env:GITHUB_REF_NAME" --generate-notes
