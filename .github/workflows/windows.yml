name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked --python 3.13
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pyright livedub/asr.py livedub/install.py livedub/settings.py
      - run: choco install ffmpeg --no-progress -y
      - run: ./scripts/build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe).FullName
          gh release view $env:GITHUB_REF_NAME --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer --clobber
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $title = "声影同传 $version"
            $releaseArgs = @()
            if ($version -match '^0\.') { $releaseArgs += '--prerelease'; $title += ' 预览版' }
            # the notes written for this version if there are any, else GitHub's list of changes
            $notes = ".github/release-notes/$env:GITHUB_REF_NAME.md"
            if (Test-Path $notes) { $releaseArgs += '--notes-file', $notes } else { $releaseArgs += '--generate-notes' }
            gh release create $env:GITHUB_REF_NAME $installer --title $title @releaseArgs
          }
